name: Breviarium

options:
  bundleIdPrefix: com.epavone.breviarium
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    # No Apple Developer Program membership, so no team/signing config here. CI builds
    # unsigned (build-ipa.yml overrides CODE_SIGNING_ALLOWED=NO on the command line);
    # actual signing happens on Windows in the sideloading tool with a free Apple ID --
    # see docs/install-on-iphone.md. These are harmless defaults if this project is ever
    # opened directly in Xcode on an actual Mac.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2" # iPhone and iPad (1.4)
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  BreviariumKit:
    path: ../Packages/BreviariumKit

targets:
  Breviarium:
    type: application
    platform: iOS
    sources:
      # BreviariumData writes breviarium-data.json directly into this folder (never
      # hand-edited or committed — see .gitignore) so Xcode's normal folder scan finds
      # and bundles it as a resource with no separate `resources:` entry -- a `resources:`
      # path pointing outside this source tree (App/../data/generated/...) silently
      # failed to end up in Bundle.main at all, confirmed by a real failing snapshot
      # test. CLAUDE.md's "everything ships inside the app bundle."
      - path: Breviarium
      # The widgets' faces (1.5), shared with the widget extension: the app's debug-only
      # gallery draws them for the UI tests' snapshots.
      - path: Shared
    dependencies:
      - package: BreviariumKit
        product: BreviariumKit
      # The widget extension (1.5), embedded in PlugIns/. Only the TestFlight and App
      # Store build keeps it: build-ipa.yml strips PlugIns/ from the sideloaded .ipa
      # (CLAUDE.md, "No capability a free Apple ID can't sign").
      - target: BreviariumWidget
    info:
      path: Breviarium/Info.plist
      properties:
        CFBundleDisplayName: Breviarium
        # The release (1.0 on 10 October 2026, 1.1 and 1.2 on 10 October, 1.3 on 11 October, 1.4
        # in November) and the build number.
        CFBundleShortVersionString: "1.5"
        CFBundleVersion: "6"
        UILaunchScreen: {}
        # Portrait is the primary layout; landscape is needed too -- CLAUDE.md's
        # parallel-English spec shows prose stacked in portrait but side by side in
        # landscape, and the snapshot matrix requires a landscape capture whenever
        # English is on.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The iPad (1.4): every orientation, as iPad multitasking requires; the reader
        # takes any window size (a two-page spread when wide, `OfficeReaders.swift`).
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The bundled typefaces (1.2), OFL, in Breviarium/Fonts (NOTICE.md). The folder is
        # scanned as a group, so the files land at the bundle's root.
        UIAppFonts:
          - IBMPlexMono-Regular.ttf
          - IBMPlexMono-Italic.ttf
          - IBMPlexMono-Bold.ttf
          - IBMPlexMono-BoldItalic.ttf
          - ComicNeue-Regular.ttf
          - ComicNeue-Italic.ttf
          - ComicNeue-Bold.ttf
          - ComicNeue-BoldItalic.ttf
          - GentiumBookPlus-Regular.ttf
          - GentiumBookPlus-Italic.ttf
          - GentiumBookPlus-Bold.ttf
          - GentiumBookPlus-BoldItalic.ttf
          - SourceSans3-Regular.ttf
          - SourceSans3-It.ttf
          - SourceSans3-Bold.ttf
          - SourceSans3-BoldIt.ttf
        # The app uses no encryption beyond what iOS itself provides (it makes no network
        # calls at all), so App Store Connect needn't ask about export compliance on
        # every upload.
        ITSAppUsesNonExemptEncryption: false
        # A tap on a widget opens breviarium://open?hour=...&date=... (1.5): a URL scheme
        # of the app's own, not an associated domain, and nothing on the network.
        CFBundleURLTypes:
          - CFBundleURLName: com.epavone.breviarium
            CFBundleURLSchemes:
              - breviarium
        # Fully offline app: no network entitlements, no background modes.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    settings:
      base:
        # Fixed forever (CLAUDE.md, Non-negotiables): every free-Apple-ID re-sign must
        # reuse this same App ID, both for AltStore/Sideloadly to treat a re-sign as the
        # same app (preserving local data) and to avoid the free tier's ~10-new-App-IDs-
        # per-week cap. Do not change this without a very good reason.
        PRODUCT_BUNDLE_IDENTIFIER: com.epavone.breviarium
        PRODUCT_NAME: Breviarium
        # iPhone and iPad from 1.4 (decided 2026-11-12, after App Review's 4.2 rejection
        # on an iPad). Set here as well as in the project settings above, explicitly: it
        # was "1" until 1.4, and XcodeGen's preset would otherwise decide. The iPad needs
        # all four orientations for multitasking (App Store Connect error 90474,
        # 2026-10-11), given below.
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The other Home Screen icons, chosen in Settings (AppIconPicker.swift).
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIconNorthumberland AppIconNorthumberlandInverted AppIconWalters AppIconBenedictus AppIconGutenbergMono AppIconGutenberg AppIconChurchOfAmbrose AppIconWeissenau"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        GENERATE_INFOPLIST_FILE: NO

  # The widgets (1.5, docs/1.5_plan.md): the day, the hour and the Lock Screen. No App
  # Group or other capability; its settings are its own (App Intents). It reads the data
  # pack and the fonts from the app's bundle, which contains it.
  BreviariumWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: BreviariumWidget
      - path: Shared
      # The themes and fonts (1.2), as the app has them.
      - path: Breviarium/DesignSystem/Theme.swift
    dependencies:
      - package: BreviariumKit
        product: BreviariumKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: AppIntents.framework
    info:
      path: BreviariumWidget/Info.plist
      properties:
        CFBundleDisplayName: Breviarium
        # Must match the app's (App Store Connect refuses an extension whose version
        # differs); testflight.yml sets both build numbers.
        CFBundleShortVersionString: "1.5"
        CFBundleVersion: "6"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.epavone.breviarium.widget
        PRODUCT_NAME: BreviariumWidget
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES

  BreviariumUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BreviariumUITests
    dependencies:
      - target: Breviarium
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.epavone.breviarium.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Breviarium:
    build:
      targets:
        Breviarium: all
        BreviariumUITests: [test]
    test:
      targets:
        - BreviariumUITests
    run:
      config: Debug
    archive:
      config: Release
