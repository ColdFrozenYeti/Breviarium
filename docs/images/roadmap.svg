<circle cx="64" cy="382" r="4.5" fill="#FF4D33"/>
<text x="96" y="384" font-family="'Hoefler Text', 'Iowan Old Style', Georgia, 'Times New Roman', serif" font-size="21" font-weight="700" fill="#FFFFFF">Beta 4</text>
<text x="840" y="383" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" letter-spacing="1.2" fill="#FF4D33">NEXT</text>
<text x="96" y="407" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#B2B2B2">Little Office of Our Lady (Roman) · Office of the Dead · the Martyrology</text>
<circle cx="64" cy="448" r="10" fill="#000000" stroke="#B2B2B2" stroke-width="2"/>
<text x="96" y="450" font-family="'Hoefler Text', 'Iowan Old Style', Georgia, 'Times New Roman', serif" font-size="21" font-weight="700" fill="#FFFFFF">Beta 5</text>
<text x="840" y="449" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" letter-spacing="1.2" fill="#B2B2B2">PLANNED</text>
<text x="96" y="473" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#B2B2B2">The Dominican rite (Ordo Prædicatorum, 1962)</text>
<circle cx="64" cy="514" r="10" fill="#000000" stroke="#FF8080" stroke-width="2" stroke-dasharray="3 3"/>
<text x="96" y="516" font-family="'Hoefler Text', 'Iowan Old Style', Georgia, 'Times New Roman', serif" font-size="21" font-weight="700" fill="#FFFFFF">Beta 6</text>
<text x="840" y="515" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" letter-spacing="1.2" fill="#FF8080">NEEDS A SOURCE</text>
<text x="96" y="539" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#B2B2B2">The Ambrosian rite, from a text source still to be chosen</text>
<circle cx="64" cy="580" r="10" fill="#000000" stroke="#B2B2B2" stroke-width="2"/>
<text x="96" y="582" font-family="'Hoefler Text', 'Iowan Old Style', Georgia, 'Times New Roman', serif" font-size="21" font-weight="700" fill="#FFFFFF">Beta 7</text>
<text x="840" y="581" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" letter-spacing="1.2" fill="#B2B2B2">PLANNED</text>
<text x="96" y="605" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#B2B2B2">Little Office of Our Lady (Ambrosian)</text>
<rect x="54" y="636" width="20" height="20" transform="rotate(45 64 646)" fill="#000000" stroke="#FFFFFF" stroke-width="2"/>
<text x="96" y="648" font-family="'Hoefler Text', 'Iowan Old Style', Georgia, 'Times New Roman', serif" font-size="21" font-weight="700" fill="#FFFFFF">1.0</text>
<text x="840" y="647" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" letter-spacing="1.2" fill="#FFFFFF">GOAL</text>
<text x="96" y="671" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#B2B2B2">Phone checks, landscape and the largest text size, then a freeze</text>
<circle cx="64" cy="712" r="7" fill="#000000" stroke="#5C5C5C" stroke-width="1.5" stroke-dasharray="2 3"/>
<text x="96" y="714" font-family="'Hoefler Text', 'Iowan Old Style', Georgia, 'Times New Roman', serif" font-size="21" font-weight="700" fill="#B2B2B2">After 1.0</text>
<text x="840" y="713" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" letter-spacing="1.2" fill="#B2B2B2">POSSIBLE</text>
<text x="96" y="737" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#B2B2B2" font-style="italic">The Monastic office (1963), and votive offices</text>
</svg>
