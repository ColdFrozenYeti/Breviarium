<svg xmlns="http://www.w3.org/2000/svg" width="880" height="718" viewBox="0 0 880 718" role="img" aria-labelledby="t d">
<title id="t">Breviarium roadmap</title>
<desc id="d">Released: the alpha to 1.0, the Roman office from Matins to Compline with the Little Office of Our Lady, the Office of the Dead, the Martyrology, the Dominican rite and Ambrosian Compline; 1.1, Ambrosian Compline as prayed; 1.2 and 1.3, colour themes, typefaces and app icons; 1.4, native iPad support with the open-book spread, the Kalendarium and visible menus; 1.5, widgets; 1.6, reminders. Next: 1.7, the iPhone Duo, the Thea icon and Keep screen awake, and the first App Store release. Then 2.0: votive offices, the Ambrosian Office of the Dead and Little Office, and the full Ambrosian office once a complete source is found. Maybe later: the Monastic office.</desc>
