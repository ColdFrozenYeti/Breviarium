name: Website

# The privacy policy and support pages the App Store listing links to (2026-10-11),
# served by GitHub Pages from site/, with the app's own Gentium Book Plus and icon
# copied in at deploy time, at https://breviarium.eduardopavone.eu/ (decided 2026-10-11).
# Needs Settings -> Pages -> Source: GitHub Actions, the custom domain set there, and a
# DNS CNAME record breviarium -> coldfrozenyeti.github.io at the domain's registrar
# (GoDaddy). The CNAME file in site/ records the domain; Actions deployments take it
# from Settings, not from the file.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Assemble the site
        run: |
          set -euo pipefail
          if grep -rl '@@CONTACT@@' site; then
            echo "The contact address is still a placeholder." >&2
            exit 1
          fi
          mkdir -p _site/fonts
          cp -R site/. _site/
          cp App/Breviarium/Fonts/GentiumBookPlus-{Regular,Italic,Bold}.ttf \
             App/Breviarium/Fonts/OFL-GentiumBookPlus.txt _site/fonts/
          cp App/Breviarium/Assets.xcassets/AppIcon.appiconset/icon-1024.png _site/icon.png

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
