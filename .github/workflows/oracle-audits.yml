name: Oracle audits

# The full-range oracle audits: every day 2025-2040 against Divinum Officium's own
# rendering, for content, commemorations, psalmody (both psalters) and the English
# (vespersFullRange* in Packages/BreviariumKit/Tests/OracleTests), and from Beta 2 the
# day hours (dayHoursFullRange*, split by years across four jobs since B5-M0), and from Beta 3 Matins, split
# by years across four jobs since it alone takes over an hour, and from Beta 4 the Little
# Office and the Office of the Dead (votive*). Split out of Kit CI in
# Beta 1 (docs/PLAN.md, B1-M4) because together they take several times longer than the
# fast suite; they still run on every pull request and main push, in parallel with Kit
# CI, and on demand. Linux only, like Kit CI.

on:
  push:
    branches: [main]
    paths:
      - "Packages/BreviariumKit/**"
      - "data/oracle-fixtures/**"
      - ".github/workflows/oracle-audits.yml"
  pull_request:
    paths:
      - "Packages/BreviariumKit/**"
      - "data/oracle-fixtures/**"
      - ".github/workflows/oracle-audits.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A push to a pull request runs the jobs below only if something they check changed
  # since the last commit that passed this workflow (scripts/ci-needs-run.sh; GitHub's
  # `paths:` alone looks at the whole pull request). Main pushes always run.
  changes:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.head_ref }}
        run: scripts/ci-needs-run.sh oracle-audits.yml '^(Packages/BreviariumKit/|data/oracle-fixtures/|\.github/workflows/oracle-audits\.yml)'

  audits:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: vespers
            filter: vespersFullRange
          # The day hours, Lauds to Compline, split by years like Matins (B5-M0: as one
          # job it took about an hour). The first also runs the 2044 hold-out and the
          # title line, which don't follow the years.
          - name: day hours 2025-2028, 2044 and title line
            filter: "dayHoursFullRangeAudit|dayHoursFullRangeBeaAudit|dayHoursFullRangeHoldout2044|dayHoursFullRangeHeadLineAudit"
            hours: Completorium,Tertia,Sexta,Nona,Prima,Laudes
            years: 2025-2028
          - name: day hours 2029-2032
            filter: "dayHoursFullRangeAudit|dayHoursFullRangeBeaAudit"
            hours: Completorium,Tertia,Sexta,Nona,Prima,Laudes
            years: 2029-2032
          - name: day hours 2033-2036
            filter: "dayHoursFullRangeAudit|dayHoursFullRangeBeaAudit"
            hours: Completorium,Tertia,Sexta,Nona,Prima,Laudes
            years: 2033-2036
          - name: day hours 2037-2040
            filter: "dayHoursFullRangeAudit|dayHoursFullRangeBeaAudit"
            hours: Completorium,Tertia,Sexta,Nona,Prima,Laudes
            years: 2037-2040
          - name: matins 2025-2028 and 2044
            filter: "dayHoursFullRangeAudit|dayHoursFullRangeBeaAudit|dayHoursFullRangeHoldout2044"
            hours: Matutinum
            years: 2025-2028
          - name: matins 2029-2032
            filter: "dayHoursFullRangeAudit|dayHoursFullRangeBeaAudit"
            hours: Matutinum
            years: 2029-2032
          - name: matins 2033-2036
            filter: "dayHoursFullRangeAudit|dayHoursFullRangeBeaAudit"
            hours: Matutinum
            years: 2033-2036
          - name: matins 2037-2040
            filter: "dayHoursFullRangeAudit|dayHoursFullRangeBeaAudit"
            hours: Matutinum
            years: 2037-2040
          # Beta 4: the Little Office (every hour, 2026-2027) and the Office of the Dead
          # (Matins, Lauds, Vespers, 2026), both psalters and the 2044 hold-outs.
          - name: little office
            filter: "votiveAudit|votiveBeaAudit|votiveHoldout2044"
            votives: C12
          - name: office of the dead
            filter: "votiveAudit|votiveBeaAudit|votiveHoldout2044"
            votives: C9
    name: audits (${{ matrix.name }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # Same toolchain setup as kit-ci.yml (see the notes there).
      - uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.3.3"
          skip-verify-signature: true

      - name: swift build
        working-directory: Packages/BreviariumKit
        run: swift build --build-tests

      - name: Full-range oracle audits
        working-directory: Packages/BreviariumKit
        env:
          BREVIARIUM_AUDIT_HOURS: ${{ matrix.hours }}
          BREVIARIUM_AUDIT_YEARS: ${{ matrix.years }}
          BREVIARIUM_AUDIT_VOTIVES: ${{ matrix.votives }}
        run: swift test --skip-build --filter "${{ matrix.filter }}"
