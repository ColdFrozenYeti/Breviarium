name: TestFlight

# Signs the app and uploads it to App Store Connect, for TestFlight and, later, the App
# Store (2026-10-11, after the paid Apple Developer Program was joined). Manual only:
# click "Run workflow"; the build appears in App Store Connect -> TestFlight after
# Apple's processing, usually 10-30 minutes.
#
# It is build-ipa.yml's build with signing on top, as CLAUDE.md asks. Until 1.5 the app
# was archived unsigned; since 1.5 the archive is signed through the App Store Connect
# API key (Apple's cloud-managed development certificate), so the widgets' App Group
# entitlement is embedded, and the export re-signs it with Apple's cloud-managed
# distribution certificate and an App Store profile that Xcode fetches or creates. No
# certificate, private key or profile is stored anywhere; the runner holds the key only
# for the job.
#
# Secrets (repository Settings -> Secrets and variables -> Actions):
#   ASC_KEY_P8     the API key file's whole text (-----BEGIN PRIVATE KEY----- ...)
#   ASC_KEY_ID     the key's ID
#   ASC_ISSUER_ID  the issuer ID shown above the keys list
#   APPLE_TEAM_ID  the team ID (developer.apple.com -> Membership details)
# The key needs the Admin role: cloud-managed certificates require it.
#
# The build number is 100 + this workflow's run number, so every upload is unique and
# higher than the sideloaded builds' (project.yml's CFBundleVersion); the version
# (CFBundleShortVersionString) comes from project.yml unchanged.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: xcode-27
    env:
      XCODE_VERSION: "27.2"

    steps:
      - name: Check the secrets are set
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for name in ASC_KEY_P8 ASC_KEY_ID ASC_ISSUER_ID APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then echo "::error::Secret $name is not set"; missing=1; fi
          done
          exit $missing

      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: sudo xcode-select -switch /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - name: Generate the bundled data file
        working-directory: Packages/BreviariumKit
        run: swift run BreviariumData ../../data/divinum-officium ../../App/Breviarium/breviarium-data.json

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: App
        run: |
          set -euo pipefail
          BUILD_NUMBER=$((100 + GITHUB_RUN_NUMBER))
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          xcodegen generate
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" Breviarium/Info.plist
          # The widget extension's too (1.5): App Store Connect refuses an extension
          # whose version differs from its app's.
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" BreviariumWidget/Info.plist
          echo "Version $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Breviarium/Info.plist) ($BUILD_NUMBER)"

      # The API key, for the archive's signing and the export's (1.5); removed at the end
      # of the job whatever happens (the last step).
      - name: Write the App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          chmod 600 "$KEY"
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"

      # Signed at the archive (1.5), not unsigned as before: an unsigned archive embeds no
      # entitlements, so the export would sign the app and the widget without the App
      # Group the widgets read the app's settings through. An ad-hoc signature (no
      # certificate) was tried first and refused: "Ad Hoc code signing is not allowed
      # with SDK 'iOS 26.5'" (run 43631738200). So the archive is signed automatically,
      # with Apple's cloud-managed development certificate, through the same API key; Xcode
      # registers the widget's App ID and the App Group and makes the profiles. The export
      # then re-signs for distribution, keeping the entitlements.
      - name: Archive (signed through the API key, to keep the App Group entitlement)
        working-directory: App
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -project Breviarium.xcodeproj \
            -scheme Breviarium \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Breviarium.xcarchive \
            -derivedDataPath build \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID"

      # The App Group (1.5) must be in both signatures, or the widgets can't follow the
      # app's settings on the phone. Checked on the archive: the export uploads straight
      # to App Store Connect and leaves no .ipa behind, and it keeps these entitlements.
      - name: Check the App Group is in the app's and the widget's signatures
        working-directory: App
        run: |
          set -euo pipefail
          APP=build/Breviarium.xcarchive/Products/Applications/Breviarium.app
          for BUNDLE in "$APP" "$APP/PlugIns/BreviariumWidget.appex"; do
            codesign -d --entitlements :- "$BUNDLE" 2>/dev/null | grep -q group.com.epavone.breviarium \
              || { echo "::error::No App Group entitlement in $BUNDLE"; exit 1; }
          done

      - name: Sign and upload to App Store Connect
        working-directory: App
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/Breviarium.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Uploaded build $BUILD_NUMBER; it appears in App Store Connect -> TestFlight once Apple has processed it." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the App Store Connect key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
