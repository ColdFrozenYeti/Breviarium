name: Kit CI

# BreviariumKit must build and test on Linux with the open-source Swift toolchain —
# this is the cheap, fast, primary signal (Linux runner minutes, not macOS's 10x-costlier
# ones). App builds and UI snapshot tests are a separate workflow (app-ci.yml) scoped to
# only run when App/ or Packages/ change on a path that actually needs a macOS runner.

on:
  push:
    branches: [main]
    paths:
      - "Packages/BreviariumKit/**"
      - "data/oracle-fixtures/**"
      - ".github/workflows/kit-ci.yml"
  pull_request:
    paths:
      - "Packages/BreviariumKit/**"
      - "data/oracle-fixtures/**"
      - ".github/workflows/kit-ci.yml"
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # v2's supported-version list is a hardcoded array baked in at v2.4.0's release
      # (tops out at 6.2.1), so it doesn't know about 6.3.3. v3 (in beta as of this
      # writing, but the actively developed line -- v2 is legacy per the action's own
      # README) resolves versions dynamically via Swiftly instead.
      - uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.3.3"
          # The action's own Swiftly-signature GPG check fails with "Can't check
          # signature: No public key" as of 2026-09-23 -- reproducible on every run,
          # not flaky (confirmed by re-running twice, identical failure both times).
          # This is the action's own documented escape hatch for that class of issue,
          # not a workaround around our own build; it only affects how the toolchain
          # download itself is verified, not anything this project ships.
          skip-verify-signature: true

      - name: swift build
        working-directory: Packages/BreviariumKit
        run: swift build

      - name: swift test
        working-directory: Packages/BreviariumKit
        run: swift test

      # Runs BreviariumData against the real pinned DO checkout -- the actual M2
      # deliverable (docs/PLAN.md): a real bundle, with a real size report, not just
      # unit tests against small fixtures.
      - name: Run BreviariumData against the pinned DO checkout
        working-directory: Packages/BreviariumKit
        run: swift run BreviariumData ../../data/divinum-officium ../../breviarium-data-bundle.json

      - uses: actions/upload-artifact@v7
        with:
          name: breviarium-data-bundle
          path: breviarium-data-bundle.json
          if-no-files-found: error
