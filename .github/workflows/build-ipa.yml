name: Build IPA

# Produces an UNSIGNED device build of the app, packaged as a plain .ipa, and uploads it
# as a workflow artifact. CI never signs anything here -- there is no Apple Developer
# Program membership and no App Store Connect account for it to sign with. Signing
# happens on Windows, in a sideloading tool, using a free Apple ID -- see
# docs/install-on-iphone.md.
#
# Manual only: click "Run workflow" whenever a fresh .ipa is needed, then run
# scripts/get-ipa.ps1 to fetch it. Given a release tag, it also publishes the .ipa as a
# GitHub pre-release under that tag, with the notes file as its description (e.g. tag
# "Beta-2", notes docs/releases/beta-2.md). The .ipa is still unsigned.
#
# If a paid Apple Developer Program membership is ever added later, the intended change
# is additive: a signing step slots in between the build step below and the packaging
# step, rather than restructuring this workflow.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish as a pre-release under this tag (leave empty for an artifact only)"
        required: false
        default: ""
      release_title:
        description: "The release's title"
        required: false
        default: ""
      release_notes:
        description: "Path of the release notes file in the repository"
        required: false
        default: ""

permissions:
  contents: write # only used by the optional release step

jobs:
  build-ipa:
    runs-on: macos-26
    env:
      # Pinned explicitly, matching app-ci.yml -- see docs/PLAN.md, Risks
      # ("Xcode/SDK version drift").
      XCODE_VERSION: "26.5"

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true # The app bundles real data generated from the pinned checkout

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: sudo xcode-select -switch /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - name: Generate the bundled data file
        working-directory: Packages/BreviariumKit
        # Written directly into App/Breviarium/ (an XcodeGen `sources` folder) so Xcode's
        # normal resource scan picks it up -- a `resources:` entry pointing outside the
        # source tree silently failed to land in Bundle.main (confirmed by a failing
        # snapshot test). See App/project.yml's own comment.
        run: swift run BreviariumData ../../data/divinum-officium ../../App/Breviarium/breviarium-data.json

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: App
        run: xcodegen generate

      - name: Build unsigned device build
        working-directory: App
        run: |
          xcodebuild build \
            -project Breviarium.xcodeproj \
            -scheme Breviarium \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package as .ipa
        working-directory: App
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/Breviarium.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Expected app bundle not found at $APP_PATH" >&2
            find build/Build/Products -maxdepth 2 >&2 || true
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload Breviarium.ipa

      - uses: actions/upload-artifact@v7
        with:
          name: Breviarium-ipa
          path: App/Breviarium.ipa
          if-no-files-found: error

      - name: Publish the release
        if: ${{ inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          TITLE: ${{ inputs.release_title }}
          NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          cp App/Breviarium.ipa "Breviarium-${TAG}.ipa"
          gh release create "$TAG" "Breviarium-${TAG}.ipa" \
            --target "$GITHUB_SHA" \
            --title "${TITLE:-$TAG}" \
            --notes-file "${NOTES:-/dev/null}" \
            --prerelease
