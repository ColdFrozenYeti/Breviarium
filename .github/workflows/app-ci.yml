name: App CI

# Builds the app and runs the UI test/snapshot lane on a macOS runner. Scoped to only
# fire when App/ or the Kit package actually changed, since macOS runner minutes cost
# ~10x Linux minutes on GitHub's included quota (see docs/PLAN.md, Testing strategy).
# No signing here — this builds for the simulator only, which needs none. The unsigned
# device build and .ipa packaging live in build-ipa.yml.

on:
  push:
    branches: [main]
    paths:
      - "App/**"
      - "Packages/BreviariumKit/**"
      - ".github/workflows/app-ci.yml"
  pull_request:
    paths:
      - "App/**"
      - "Packages/BreviariumKit/**"
      - ".github/workflows/app-ci.yml"
  workflow_dispatch:
    inputs:
      only_testing:
        # A run by hand can build the app and run just the UI tests a small app change
        # needs, e.g. `BreviariumUITests/LaunchAndNavigationUITests/testAppIconPicker`
        # (xcodebuild's -only-testing; several separated by spaces). Empty runs them all.
        # The pull request's own runs, and every main push, still run everything.
        description: "UI tests to run (xcodebuild -only-testing identifiers, space-separated); empty for all"
        required: false
        default: ""

# A newer push to the same pull request cancels its older, now-redundant run (macOS
# minutes cost ~10x Linux ones). Pushes to main never cancel each other, so every main
# commit keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A push to a pull request runs the jobs below only if something they check changed
  # since the last commit that passed this workflow (scripts/ci-needs-run.sh; GitHub's
  # `paths:` alone looks at the whole pull request). Main pushes always run.
  changes:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.head_ref }}
        run: scripts/ci-needs-run.sh app-ci.yml '^(App/|Packages/BreviariumKit/|\.github/workflows/app-ci\.yml)'

  # Build once (build-for-testing), then run the UI-test classes on five runners at once
  # (1.4). On one runner they took 61 of App CI's 65 minutes, one class after another;
  # three cloned simulators on one runner were tried on 27 September and timed out, so
  # each group gets a runner of its own (free for a public repository; five is the free
  # plan's macOS concurrency).
  build:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: macos-26
    env:
      # Pinned explicitly rather than trusting the runner image's rolling default --
      # see docs/PLAN.md, Risks ("Xcode/SDK version drift"). Confirmed present on the
      # macos-26 GA image as of M0; revisit if GitHub deprecates that image.
      XCODE_VERSION: "26.5"

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true # M5: the app now bundles real data generated from the pinned checkout

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: sudo xcode-select -switch /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - name: Generate the bundled data file
        working-directory: Packages/BreviariumKit
        # Written directly into App/Breviarium/ (an XcodeGen `sources` folder) so Xcode's
        # normal resource scan picks it up -- a `resources:` entry pointing outside the
        # source tree silently failed to land in Bundle.main (confirmed by a failing
        # snapshot test). See App/project.yml's own comment.
        run: swift run BreviariumData ../../data/divinum-officium ../../App/Breviarium/breviarium-data.json

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: App
        run: xcodegen generate

      - name: Build for testing
        working-directory: App
        run: |
          xcodebuild build-for-testing \
            -project Breviarium.xcodeproj \
            -scheme Breviarium \
            -destination "platform=iOS Simulator,name=iPhone 17,OS=latest" \
            -derivedDataPath DerivedData

      # App Store requirements (CLAUDE.md, "Before the App Store release"): the privacy
      # manifest is in the bundle and valid, and the export-compliance key is set.
      - name: Check the privacy manifest, export-compliance key, device family and minimum iOS
        working-directory: App
        run: |
          set -euo pipefail
          APP=DerivedData/Build/Products/Debug-iphonesimulator/Breviarium.app
          test -d "$APP"
          plutil -lint "$APP/PrivacyInfo.xcprivacy"
          test "$(plutil -extract NSPrivacyTracking raw "$APP/PrivacyInfo.xcprivacy")" = false
          test "$(plutil -extract ITSAppUsesNonExemptEncryption raw "$APP/Info.plist")" = false
          # iPhone only: an iPad family here makes App Store Connect demand iPad orientations.
          test "$(plutil -extract UIDeviceFamily json -o - "$APP/Info.plist")" = "[1]"
          # Runs on any iOS 26 (decided 2026-10-11), not only 26.5.
          test "$(plutil -extract MinimumOSVersion raw "$APP/Info.plist")" = 26.0

      # A tarball keeps the bundles' symlinks and permissions, which an artifact alone drops.
      - name: Pack the test build
        working-directory: App/DerivedData/Build
        run: tar -czf "$GITHUB_WORKSPACE/test-build.tar.gz" Products

      - uses: actions/upload-artifact@v7
        with:
          name: test-build
          path: test-build.tar.gz
          retention-days: 1

  ui-tests:
    needs: build
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        # Balanced on the classes' times in run 196 (22 October 2026), in seconds:
        # VespersMatrix 590, Matins 500, DayHours 394, Ambrosian 344, LaunchAndNavigation
        # 336, VotiveOffices 229, Theme 211, Dominican 163, Font 142, Gallery 105.
        # PromoUITests is left out: it skips itself outside promo.yml.
        include:
          - group: vespers
            classes: VespersMatrixUITests
          - group: matins
            classes: MatinsUITests GalleryUITests
          - group: day-hours
            classes: DayHoursUITests ThemeUITests
          - group: ambrosian-votive
            classes: AmbrosianUITests VotiveOfficesUITests
          - group: launch-dominican-font
            classes: LaunchAndNavigationUITests DominicanUITests FontUITests
    name: ui-tests (${{ matrix.group }})
    env:
      XCODE_VERSION: "26.5"
    steps:
      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: sudo xcode-select -switch /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - uses: actions/download-artifact@v7
        with:
          name: test-build

      - name: Unpack the test build
        run: |
          mkdir -p build
          tar -xzf test-build.tar.gz -C build

      - name: Run UI tests
        env:
          CLASSES: ${{ matrix.classes }}
          ONLY_TESTING: ${{ inputs.only_testing }}
        run: |
          set -euo pipefail
          XCTESTRUN=$(ls build/Products/*.xctestrun | head -1)
          only=()
          if [ -n "$ONLY_TESTING" ]; then
            # A run by hand: only the asked-for tests that belong to this group's classes.
            for t in $ONLY_TESTING; do
              class=$(echo "$t" | cut -d/ -f2)
              for c in $CLASSES; do [ "$class" = "$c" ] && only+=("-only-testing:$t"); done
            done
            if [ ${#only[@]} -eq 0 ]; then echo "No asked-for test is in this group."; exit 0; fi
          else
            for c in $CLASSES; do only+=("-only-testing:BreviariumUITests/$c"); done
          fi
          xcodebuild test-without-building \
            -xctestrun "$XCTESTRUN" \
            -destination "platform=iOS Simulator,name=iPhone 17,OS=latest" \
            -parallel-testing-enabled NO \
            -resultBundlePath TestResults.xcresult \
            "${only[@]}"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-results-${{ matrix.group }}
          path: TestResults.xcresult
          if-no-files-found: ignore

      # Snapshot tests attach a named PNG (XCTAttachment, .lifetime = .keepAlways) per
      # screen/config -- extracted here so they can be downloaded and measured without
      # opening the (Mac-only) .xcresult bundle itself.
      - name: Extract snapshot PNGs
        if: always()
        run: |
          mkdir -p Snapshots
          if [ -d TestResults.xcresult ]; then
            xcrun xcresulttool export attachments \
              --path TestResults.xcresult \
              --output-path Snapshots \
              --legacy || echo "No attachments found (tests may have failed before capturing any)."
          fi

      - name: Upload snapshot PNGs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: snapshots-${{ matrix.group }}
          path: Snapshots
          if-no-files-found: ignore

  # One `snapshots` artifact as before, with a folder per group.
  snapshots:
    needs: ui-tests
    if: always() && needs.ui-tests.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: snapshots-*
          path: Snapshots

      - name: Upload snapshot PNGs
        uses: actions/upload-artifact@v7
        with:
          name: snapshots
          path: Snapshots
          if-no-files-found: ignore
