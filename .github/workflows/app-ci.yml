name: App CI

# Builds the app and runs the UI test/snapshot lane on a macOS runner. Scoped to only
# fire when App/ or the Kit package actually changed, since macOS runner minutes cost
# ~10x Linux minutes on GitHub's included quota (see docs/PLAN.md, Testing strategy).
# No signing here — this builds for the simulator only, which needs none. The unsigned
# device build and .ipa packaging live in build-ipa.yml.

on:
  push:
    branches: [main]
    paths:
      - "App/**"
      - "Packages/BreviariumKit/**"
      - ".github/workflows/app-ci.yml"
  pull_request:
    paths:
      - "App/**"
      - "Packages/BreviariumKit/**"
      - ".github/workflows/app-ci.yml"
  workflow_dispatch:
    inputs:
      only_testing:
        # A run by hand can build the app and run just the UI tests a small app change
        # needs, e.g. `BreviariumUITests/LaunchAndNavigationUITests/testAppIconPicker`
        # (xcodebuild's -only-testing; several separated by spaces). Empty runs them all.
        # The pull request's own runs, and every main push, still run everything.
        description: "UI tests to run (xcodebuild -only-testing identifiers, space-separated); empty for all"
        required: false
        default: ""

# A newer push to the same pull request cancels its older, now-redundant run (macOS
# minutes cost ~10x Linux ones). Pushes to main never cancel each other, so every main
# commit keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A push to a pull request runs the jobs below only if something they check changed
  # since the last commit that passed this workflow (scripts/ci-needs-run.sh; GitHub's
  # `paths:` alone looks at the whole pull request). Main pushes always run.
  changes:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.head_ref }}
        run: scripts/ci-needs-run.sh app-ci.yml '^(App/|Packages/BreviariumKit/|\.github/workflows/app-ci\.yml)'

  # Build once (build-for-testing), then run the UI-test classes on five runners at once
  # (1.4). On one runner they took 61 of App CI's 65 minutes, one class after another;
  # three cloned simulators on one runner were tried on 27 September and timed out, so
  # each group gets a runner of its own (free for a public repository; five is the free
  # plan's macOS concurrency).
  build:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: xcode-27
    env:
      # Pinned explicitly rather than trusting the runner image's rolling default --
      # see docs/PLAN.md, Risks ("Xcode/SDK version drift"). Since 1.7 the iOS 27 SDK
      # (27.1 or later is what makes the app native on the iPhone Duo), on GitHub's
      # xcode-27 image (Xcode 27.0, 27.1 and 27.2; the iPhone Duo simulator is on
      # iOS 27.1 and 27.2). The deployment target stays iOS 26.0.
      XCODE_VERSION: "27.2"

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true # M5: the app now bundles real data generated from the pinned checkout

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: sudo xcode-select -switch /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - name: Generate the bundled data file
        working-directory: Packages/BreviariumKit
        # Written directly into App/Breviarium/ (an XcodeGen `sources` folder) so Xcode's
        # normal resource scan picks it up -- a `resources:` entry pointing outside the
        # source tree silently failed to land in Bundle.main (confirmed by a failing
        # snapshot test). See App/project.yml's own comment.
        run: swift run BreviariumData ../../data/divinum-officium ../../App/Breviarium/breviarium-data.json

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: App
        run: xcodegen generate

      - name: Build for testing
        working-directory: App
        run: |
          xcodebuild build-for-testing \
            -project Breviarium.xcodeproj \
            -scheme Breviarium \
            -destination "platform=iOS Simulator,name=iPhone 17,OS=latest" \
            -derivedDataPath DerivedData

      # App Store requirements (CLAUDE.md, "Before the App Store release"): the privacy
      # manifest is in the bundle and valid, and the export-compliance key is set.
      - name: Check the privacy manifest, export-compliance key, device family and minimum iOS
        working-directory: App
        run: |
          set -euo pipefail
          APP=DerivedData/Build/Products/Debug-iphonesimulator/Breviarium.app
          test -d "$APP"
          plutil -lint "$APP/PrivacyInfo.xcprivacy"
          test "$(plutil -extract NSPrivacyTracking raw "$APP/PrivacyInfo.xcprivacy")" = false
          test "$(plutil -extract ITSAppUsesNonExemptEncryption raw "$APP/Info.plist")" = false
          # iPhone and iPad (1.4), with every iPad orientation, which App Store Connect
          # demands of an iPad app (error 90474).
          test "$(plutil -extract UIDeviceFamily json -o - "$APP/Info.plist")" = "[1,2]"
          test "$(plutil -extract 'UISupportedInterfaceOrientations~ipad' json -o - "$APP/Info.plist" | tr -cd ',' | wc -c | tr -d ' ')" = 3
          # Runs on any iOS 26 (decided 2026-10-11), not only 26.5.
          test "$(plutil -extract MinimumOSVersion raw "$APP/Info.plist")" = 26.0
          # The widget extension (1.5): embedded, its own bundle ID, iPhone and iPad, its
          # privacy manifest, the app's version, and the data pack it reads in the app.
          EXT="$APP/PlugIns/BreviariumWidget.appex"
          test -d "$EXT"
          test "$(plutil -extract CFBundleIdentifier raw "$EXT/Info.plist")" = com.epavone.breviarium.widget
          test "$(plutil -extract NSExtension.NSExtensionPointIdentifier raw "$EXT/Info.plist")" = com.apple.widgetkit-extension
          test "$(plutil -extract UIDeviceFamily json -o - "$EXT/Info.plist")" = "[1,2]"
          test "$(plutil -extract CFBundleShortVersionString raw "$EXT/Info.plist")" = "$(plutil -extract CFBundleShortVersionString raw "$APP/Info.plist")"
          test "$(plutil -extract CFBundleVersion raw "$EXT/Info.plist")" = "$(plutil -extract CFBundleVersion raw "$APP/Info.plist")"
          plutil -lint "$EXT/PrivacyInfo.xcprivacy"
          test "$(plutil -extract NSPrivacyTracking raw "$EXT/PrivacyInfo.xcprivacy")" = false
          test -s "$APP/breviarium-widget.pack"
          # The App Group the widgets follow the app's settings through (1.5), for both
          # targets. A simulator build keeps its entitlements as "simulated" ones, outside
          # the code signature `codesign -d` reads, so the check reads what the build
          # wrote for each target (testflight.yml checks the real device signatures).
          INTER=DerivedData/Build/Intermediates.noindex/Breviarium.build/Debug-iphonesimulator
          for XCENT in "$INTER/Breviarium.build/Breviarium.app-Simulated.xcent" \
                       "$INTER/BreviariumWidget.build/BreviariumWidget.appex-Simulated.xcent"; do
            grep -q group.com.epavone.breviarium "$XCENT" \
              || { echo "No App Group entitlement in $XCENT" >&2; exit 1; }
          done
          test "$(plutil -extract CFBundleURLTypes.0.CFBundleURLSchemes.0 raw "$APP/Info.plist")" = breviarium
          # The reminders (1.6) are local notifications: no push entitlement and no
          # background mode, so a free Apple ID can still sign the app (CLAUDE.md).
          if plutil -extract UIBackgroundModes raw "$APP/Info.plist" >/dev/null 2>&1; then
            echo "UIBackgroundModes must not be declared" >&2; exit 1
          fi
          for XCENT in "$INTER/Breviarium.build/Breviarium.app-Simulated.xcent" Breviarium/Breviarium.entitlements; do
            if grep -q aps-environment "$XCENT"; then
              echo "No push entitlement may be declared ($XCENT)" >&2; exit 1
            fi
          done

      # 1.7: on a Dark Home Screen, Northumberland Simple (the primary icon) and
      # Northumberland show Northumberland Inverted: each set carries a dark appearance,
      # which must reach the compiled catalog for the alternate icon as well.
      - name: Check the dark app icons
        working-directory: App
        run: |
          set -euo pipefail
          CAR=DerivedData/Build/Products/Debug-iphonesimulator/Breviarium.app/Assets.car
          xcrun --sdk iphonesimulator assetutil --info "$CAR" > assets.json
          python3 - <<'PY'
          import json, sys
          entries = [e for e in json.load(open("assets.json")) if isinstance(e, dict)]
          def dark(name):
              return [e for e in entries if e.get("Name") == name
                      and any("dark" in str(v).lower() for k, v in e.items() if "appearance" in k.lower())]
          missing = [n for n in ("AppIcon", "AppIconNorthumberland") if not dark(n)]
          for n in ("AppIcon", "AppIconNorthumberland", "AppIconThea"):
              print(n, sorted({str(e.get("Appearance", "")) for e in entries if e.get("Name") == n}))
          if missing:
              print("No dark rendition for:", missing, file=sys.stderr)
              sys.exit(1)
          PY

      # A tarball keeps the bundles' symlinks and permissions, which an artifact alone drops.
      - name: Pack the test build
        working-directory: App/DerivedData/Build
        run: tar -czf "$GITHUB_WORKSPACE/test-build.tar.gz" Products

      - uses: actions/upload-artifact@v7
        with:
          name: test-build
          path: test-build.tar.gz
          retention-days: 1

  ui-tests:
    # A hung simulator once held a group for 90 minutes (2026-11-12). 45 until 1.7, when
    # Xcode 27's slower simulator start-up took the iPad group past it (run 44071359508).
    timeout-minutes: 60
    needs: build
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        # Rebalanced for 1.7 (Xcode 27.2, iOS 27.2 simulators, and the iPhone Duo): each
        # simulator pass now costs 6 to 8 minutes before its first test (xcodebuild's
        # first launch on a fresh device; run 44071359508), so the iPad and the Duo have
        # passes of their own, and the iPhone classes are spread over the other jobs.
        # Approximate test minutes in that run: VespersMatrix 10, DayHours 8.5,
        # Ambrosian 8.3, Launch 7.5, Matins 7, Theme 6, Notifications 5, Dominican 4.7,
        # Votive 4, Font 3.6, Gallery 3.5, WidgetGallery 2; the iPad's classes about 15.
        # Five jobs at once is the free plan's macOS limit (shared with promo.yml: never
        # run both together). The aim is about 30 minutes for every job.
        # PromoUITests is left out: it skips itself outside promo.yml.
        include:
          - group: vespers-dayhours
            classes: VespersMatrixUITests DayHoursUITests VotiveOfficesUITests
          - group: matins-launch-theme
            classes: MatinsUITests LaunchAndNavigationUITests ThemeUITests
          - group: dominican-ambrosian-notifications
            classes: DominicanUITests AmbrosianUITests NotificationsUITests WidgetGalleryUITests GalleryUITests
          - group: ipad
            ipad_classes: IPadUITests WidgetGalleryUITests NotificationsUITests
          - group: font-duo
            classes: FontUITests
            duo_classes: DuoUITests WidgetGalleryUITests
    name: ui-tests (${{ matrix.group }})
    env:
      XCODE_VERSION: "27.2"
    steps:
      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: sudo xcode-select -switch /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      # Only for scripts/ci-simulator.sh.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
          submodules: false

      - uses: actions/download-artifact@v7
        with:
          name: test-build

      - name: Unpack the test build
        run: |
          mkdir -p build
          tar -xzf test-build.tar.gz -C build

      - name: Run UI tests
        env:
          CLASSES: ${{ matrix.classes }}
          IPAD_CLASSES: ${{ matrix.ipad_classes }}
          DUO_CLASSES: ${{ matrix.duo_classes }}
          ONLY_TESTING: ${{ inputs.only_testing }}
        run: |
          set -euo pipefail
          XCTESTRUN=$(ls build/Products/*.xctestrun | head -1)
          # One pass per device: the group's iPhone classes, then its iPad or iPhone Duo
          # classes, each on its own simulator (scripts/ci-simulator.sh) and in its own
          # result bundle.
          run_pass() {
            local device=$1 classes=$2 bundle=$3
            local only=()
            if [ -n "$ONLY_TESTING" ]; then
              # A run by hand: only the asked-for tests that belong to these classes.
              for t in $ONLY_TESTING; do
                class=$(echo "$t" | cut -d/ -f2)
                for c in $classes; do [ "$class" = "$c" ] && only+=("-only-testing:$t"); done
              done
              if [ ${#only[@]} -eq 0 ]; then echo "No asked-for test is in the $device classes."; return 0; fi
            else
              for c in $classes; do only+=("-only-testing:BreviariumUITests/$c"); done
            fi
            local udid
            udid=$(scripts/ci-simulator.sh "$device")
            xcodebuild test-without-building \
              -xctestrun "$XCTESTRUN" \
              -destination "id=$udid" \
              -parallel-testing-enabled NO \
              -test-timeouts-enabled YES \
              -default-test-execution-time-allowance 1500 \
              -maximum-test-execution-time-allowance 1500 \
              -retry-tests-on-failure -test-iterations 2 \
              -resultBundlePath "$bundle" \
              "${only[@]}"
          }
          status=0
          if [ -n "$CLASSES" ]; then run_pass iphone "$CLASSES" TestResults.xcresult || status=$?; fi
          if [ -n "$IPAD_CLASSES" ]; then run_pass ipad "$IPAD_CLASSES" TestResults-iPad.xcresult || status=$?; fi
          if [ -n "$DUO_CLASSES" ]; then run_pass duo "$DUO_CLASSES" TestResults-Duo.xcresult || status=$?; fi
          exit $status

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-results-${{ matrix.group }}
          path: TestResults*.xcresult
          if-no-files-found: ignore

      # Snapshot tests attach a named PNG (XCTAttachment, .lifetime = .keepAlways) per
      # screen/config -- extracted here so they can be downloaded and measured without
      # opening the (Mac-only) .xcresult bundle itself.
      - name: Extract snapshot PNGs
        if: always()
        run: |
          mkdir -p Snapshots
          if [ -d TestResults.xcresult ]; then
            xcrun xcresulttool export attachments \
              --path TestResults.xcresult \
              --output-path Snapshots \
              --legacy || echo "No attachments found (tests may have failed before capturing any)."
          fi
          # The iPad's captures (1.4) in a folder of their own: each export writes its own
          # manifest.json.
          if [ -d TestResults-iPad.xcresult ]; then
            mkdir -p Snapshots/ipad
            xcrun xcresulttool export attachments \
              --path TestResults-iPad.xcresult \
              --output-path Snapshots/ipad \
              --legacy || echo "No iPad attachments found."
          fi
          # The iPhone Duo's (1.7), likewise.
          if [ -d TestResults-Duo.xcresult ]; then
            mkdir -p Snapshots/duo
            xcrun xcresulttool export attachments \
              --path TestResults-Duo.xcresult \
              --output-path Snapshots/duo \
              --legacy || echo "No iPhone Duo attachments found."
          fi

      - name: Upload snapshot PNGs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: snapshots-${{ matrix.group }}
          path: Snapshots
          if-no-files-found: ignore

  # One `snapshots` artifact as before, with a folder per group.
  snapshots:
    needs: ui-tests
    # !cancelled(), not always(): always() kept this job queued after a cancel.
    if: ${{ !cancelled() && needs.ui-tests.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: snapshots-*
          path: Snapshots

      - name: Upload snapshot PNGs
        uses: actions/upload-artifact@v7
        with:
          name: snapshots
          path: Snapshots
          if-no-files-found: ignore
