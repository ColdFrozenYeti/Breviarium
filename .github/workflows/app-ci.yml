name: App CI

# Builds the app and runs the UI test/snapshot lane on a macOS runner. Scoped to only
# fire when App/ or the Kit package actually changed, since macOS runner minutes cost
# ~10x Linux minutes on GitHub's included quota (see docs/PLAN.md, Testing strategy).
# No signing here — this builds for the simulator only, which needs none. The unsigned
# device build and .ipa packaging live in build-ipa.yml.

on:
  push:
    branches: [main]
    paths:
      - "App/**"
      - "Packages/BreviariumKit/**"
      - ".github/workflows/app-ci.yml"
  pull_request:
    paths:
      - "App/**"
      - "Packages/BreviariumKit/**"
      - ".github/workflows/app-ci.yml"
  workflow_dispatch:

# A newer push to the same pull request cancels its older, now-redundant run (macOS
# minutes cost ~10x Linux ones). Pushes to main never cancel each other, so every main
# commit keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: macos-26
    env:
      # Pinned explicitly rather than trusting the runner image's rolling default —
      # see docs/PLAN.md, Risks ("Xcode/SDK version drift"). Confirmed present on the
      # macos-26 GA image as of M0; revisit if GitHub deprecates that image.
      XCODE_VERSION: "26.5"

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true # M5: the app now bundles real data generated from the pinned checkout

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: sudo xcode-select -switch /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - name: Generate the bundled data file
        working-directory: Packages/BreviariumKit
        # Written directly into App/Breviarium/ (an XcodeGen `sources` folder) so Xcode's
        # normal resource scan picks it up -- a `resources:` entry pointing outside the
        # source tree silently failed to land in Bundle.main (confirmed by a failing
        # snapshot test). See App/project.yml's own comment.
        run: swift run BreviariumData ../../data/divinum-officium ../../App/Breviarium/breviarium-data.json

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: App
        run: xcodegen generate

      - name: Build for simulator
        working-directory: App
        run: |
          xcodebuild build \
            -project Breviarium.xcodeproj \
            -scheme Breviarium \
            -destination "platform=iOS Simulator,name=iPhone 17,OS=latest"

      - name: Run UI tests
        working-directory: App
        run: |
          xcodebuild test \
            -project Breviarium.xcodeproj \
            -scheme Breviarium \
            -destination "platform=iOS Simulator,name=iPhone 17,OS=latest" \
            -resultBundlePath TestResults.xcresult

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-results
          path: App/TestResults.xcresult
          if-no-files-found: ignore

      # Snapshot tests attach a named PNG (XCTAttachment, .lifetime = .keepAlways) per
      # screen/config -- extracted here so they can be downloaded and compared against
      # design/reference/ without opening the (Mac-only) .xcresult bundle itself.
      - name: Extract snapshot PNGs
        if: always()
        working-directory: App
        run: |
          mkdir -p Snapshots
          xcrun xcresulttool export attachments \
            --path TestResults.xcresult \
            --output-path Snapshots \
            --legacy || echo "No attachments found (tests may have failed before capturing any)."

      - name: Upload snapshot PNGs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: snapshots
          path: App/Snapshots
          if-no-files-found: ignore
