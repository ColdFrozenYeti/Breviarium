name: Promo captures

# Promotional stills and screen recordings (2026-10-11), run by hand, or by a push to a
# branch other than main that changes the promo tests (a dispatch needs the workflow on
# main, and this lets the captures be tried before it is). Builds the
# app, boots an iPhone 18 Pro Max simulator (17 Pro Max before 1.7's iOS 27 SDK) (6.9", the App Store's required screenshot
# size) with a clean status bar, records its screen while PromoUITests runs, and uploads
# the stills, the raw recording and a timestamped test log to cut it by. The editing
# (captions, frames, the App Store preview) is done off CI, with ffmpeg.
# From 1.4 it also runs on an iPad Pro 13-inch, for the iPad's screenshots (2752x2064
# in landscape, composed by scripts/promo/compose.py --ipad). From 1.7 on the iPhone Duo
# too: its stills folded (the outer screen, 1398x2034, compose.py --duo-outer), then
# opened flat by scripts/duo-open.sh (duoctl) and taken again on the inner screen
# (2007x2853, compose.py --duo), then turned on its side for the two-page spread and
# facing English (2853x2007, compose.py --duo-side), each pass in a folder of its own. The
# Duo takes stills only: the tours are the iPhone's, and XCUITest's swipes don't reach
# the open Duo's inner screen. A pass on the open Duo runs only if duo-open.sh confirmed
# the screen (its `opened` output), so folded stills never pass for open ones. App CI's
# Duo pass confirmed the open screens, upright and on its side, in run 44182919305.
on:
  push:
    branches-ignore: [main]
    paths:
      - ".github/workflows/promo.yml"
      - "App/BreviariumUITests/PromoUITests.swift"
  workflow_dispatch:
    inputs:
      captures:
        # A run by hand can take only some captures, e.g. "iphone-hevc iphone-17-pro-max".
        description: "Captures to run, space-separated: iphone ipad duo (the defaults), iphone-hevc, iphone-17-pro-max, iphone-17"
        required: false
        default: "iphone ipad duo"

jobs:
  # The captures this run takes: every default on a push, those asked for by hand.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          CAPTURES: ${{ inputs.captures || 'iphone ipad duo' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          # The App Store's sizes: 6.9" iPhone, 13" iPad (1.4) and the iPhone Duo (1.7).
          # The other iPhones (1.7) only try other ways of recording the tours, after the
          # 18 Pro Max's H.264 recording kept only the start of each animation (run
          # 44190538517): HEVC on the same phone, the 17 Pro Max and the iPhone 17. They
          # record the tours alone; their stills would be the same as the iPhone's.
          all = [
              {"label": "iphone", "kind": "iphone", "device": "iPhone 18 Pro Max", "codec": "h264", "tours_only": False},
              {"label": "ipad", "kind": "ipad", "device": "iPad Pro 13-inch", "codec": "h264", "tours_only": False},
              {"label": "duo", "kind": "duo", "device": "iPhone Duo", "codec": "h264", "tours_only": False},
              {"label": "iphone-hevc", "kind": "iphone", "device": "iPhone 18 Pro Max", "codec": "hevc", "tours_only": True},
              {"label": "iphone-17-pro-max", "kind": "iphone", "device": "iPhone 17 Pro Max", "codec": "h264", "tours_only": True},
              {"label": "iphone-17", "kind": "iphone", "device": "iPhone 17", "codec": "h264", "tours_only": True},
          ]
          wanted = os.environ["CAPTURES"].split()
          unknown = sorted(set(wanted) - {c["label"] for c in all})
          if unknown:
              raise SystemExit(f"unknown captures: {unknown}")
          print("matrix=" + json.dumps([c for c in all if c["label"] in wanted]))
          PY

  capture:
    needs: plan
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: capture (${{ matrix.label }})
    env:
      XCODE_VERSION: "27.2"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: sudo xcode-select -switch /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - name: Generate the bundled data file
        working-directory: Packages/BreviariumKit
        run: swift run BreviariumData ../../data/divinum-officium ../../App/Breviarium/breviarium-data.json

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: App
        run: xcodegen generate

      - name: Boot the simulator with a clean status bar
        env:
          DEVICE: ${{ matrix.device }}
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, os, sys
          name = os.environ["DEVICE"]
          runtimes = json.load(sys.stdin)["devices"]
          ios = sorted((r for r in runtimes if "iOS" in r), reverse=True)
          devices = [d for r in ios for d in sorted(runtimes[r], key=lambda d: d["name"], reverse=True)]
          # The exact name first (so "iPhone 17" is not the "iPhone 17 Pro Max"), else a
          # prefix, as the chip in the iPad Pro name changes by Xcode. No apostrophes here:
          # this program is inside a single-quoted shell string.
          match = [d for d in devices if d["name"] == name] or [d for d in devices if d["name"].startswith(name)]
          print(match[0]["udid"])')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID"
          xcrun simctl status_bar "$UDID" override --time "9:41" --dataNetwork wifi --wifiMode active \
            --wifiBars 3 --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100

      - name: Build for testing
        working-directory: App
        run: |
          xcodebuild build-for-testing -project Breviarium.xcodeproj -scheme Breviarium \
            -destination "id=$UDID" -derivedDataPath build

      - name: Run the promo tests while recording the screen
        working-directory: App
        env:
          TEST_RUNNER_BREVIARIUM_PROMO: "1"
        run: |
          # Not -e (GitHub's default): a failed test must still reach the end of the step,
          # which stops the recorder and finishes its file. In run 44190538517 a tour's
          # failure ended the step at once and left the iPhone's recording unreadable.
          set +e
          set -uo pipefail
          mkdir -p Promo
          perl -MTime::HiRes=time -e 'printf "%.3f\n", time' > Promo/recording-start.txt
          # No recording on the Duo, which takes stills only.
          REC=""
          if [ "${{ matrix.kind }}" != duo ]; then
            xcrun simctl io "$UDID" recordVideo --codec ${{ matrix.codec }} --force Promo/recording.mov &
            REC=$!
            sleep 3
          fi
          # The folded Duo takes the iPhone's stills only, not its tours.
          ONLY=BreviariumUITests/PromoUITests
          if [ "${{ matrix.kind }}" = duo ]; then ONLY=BreviariumUITests/PromoUITests/testPromoStills; fi
          # A recording trial takes the tours only.
          SKIP=""
          if [ "${{ matrix.tours_only }}" = true ]; then
            SKIP="-skip-testing:BreviariumUITests/PromoUITests/testPromoStills"
          fi
          xcodebuild test-without-building -project Breviarium.xcodeproj -scheme Breviarium \
            -destination "id=$UDID" -derivedDataPath build -parallel-testing-enabled NO \
            -only-testing:"$ONLY" $SKIP -resultBundlePath Promo.xcresult 2>&1 \
            | perl -MTime::HiRes=time -ne '$|=1; printf "%.3f %s", time, $_' | tee Promo/test-log.txt
          STATUS=${PIPESTATUS[0]}
          # A recorder that stopped by itself mustn't fail the step (run 44190538517).
          if [ -n "$REC" ]; then
            sleep 2
            kill -INT "$REC" 2> /dev/null || true
            wait "$REC" || true
          fi
          exit "$STATUS"

      - name: Extract the stills
        if: always()
        working-directory: App
        run: |
          mkdir -p Promo/stills
          xcrun xcresulttool export attachments --path Promo.xcresult --output-path Promo/stills --legacy || true

      # The iPhone Duo opened flat (1.7): after the folded pass, which is also when an app
      # has run on it, so its inner display is active for duoctl. Never fails the job:
      # duo-open.sh warns and says opened=0 if duoctl can't open it, and the open passes
      # are then skipped.
      - name: Open the iPhone Duo upright
        id: duo_open
        if: ${{ always() && matrix.kind == 'duo' }}
        run: |
          scripts/duo-open.sh "$UDID" portrait
          xcrun simctl status_bar "$UDID" override --time "9:41" --dataNetwork wifi --wifiMode active \
            --wifiBars 3 --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100 || true

      - name: Run the stills on the open iPhone Duo
        if: ${{ always() && matrix.kind == 'duo' && steps.duo_open.outputs.opened == '1' }}
        working-directory: App
        env:
          TEST_RUNNER_BREVIARIUM_PROMO: "1"
          TEST_RUNNER_BREVIARIUM_DUO_EXPECT: open
        run: |
          xcodebuild test-without-building -project Breviarium.xcodeproj -scheme Breviarium \
            -destination "id=$UDID" -derivedDataPath build -parallel-testing-enabled NO \
            -only-testing:BreviariumUITests/PromoUITests/testPromoStills -resultBundlePath Promo-open.xcresult

      # Its own step, so a failed check above still leaves the stills taken before it.
      - name: Extract the open iPhone Duo's stills
        if: ${{ always() && matrix.kind == 'duo' && steps.duo_open.outputs.opened == '1' }}
        working-directory: App
        run: |
          mkdir -p Promo/stills-open
          xcrun xcresulttool export attachments --path Promo-open.xcresult --output-path Promo/stills-open --legacy || true

      # On its side: the two-page spread and Latin and English on facing pages.
      - name: Turn the open iPhone Duo on its side
        id: duo_side
        if: ${{ always() && matrix.kind == 'duo' && steps.duo_open.outputs.opened == '1' }}
        run: |
          scripts/duo-open.sh "$UDID" landscape
          xcrun simctl status_bar "$UDID" override --time "9:41" --dataNetwork wifi --wifiMode active \
            --wifiBars 3 --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100 || true

      - name: Run the stills on the iPhone Duo on its side
        if: ${{ always() && matrix.kind == 'duo' && steps.duo_side.outputs.opened == '1' }}
        working-directory: App
        env:
          TEST_RUNNER_BREVIARIUM_PROMO: "1"
          TEST_RUNNER_BREVIARIUM_DUO_EXPECT: side
        run: |
          xcodebuild test-without-building -project Breviarium.xcodeproj -scheme Breviarium \
            -destination "id=$UDID" -derivedDataPath build -parallel-testing-enabled NO \
            -only-testing:BreviariumUITests/PromoUITests/testPromoStillsDuoSide -resultBundlePath Promo-side.xcresult

      - name: Extract the stills of the iPhone Duo on its side
        if: ${{ always() && matrix.kind == 'duo' && steps.duo_side.outputs.opened == '1' }}
        working-directory: App
        run: |
          mkdir -p Promo/stills-side
          xcrun xcresulttool export attachments --path Promo-side.xcresult --output-path Promo/stills-side --legacy || true

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: promo-${{ matrix.label }}
          path: App/Promo
          if-no-files-found: ignore
